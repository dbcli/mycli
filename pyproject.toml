[project]
name = "mycli"
dynamic = ["version"]
description = "Rich MySQL terminal client with autocompletion, syntax highlighting, and dataframes"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Mycli Core Team" }]
classifiers = [
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: SQL',
    'Topic :: Database',
    'Topic :: Database :: Front-Ends',
    'Topic :: Software Development',
]

dependencies = [
    "click ~= 8.5.0",
    "clickdc ~= 0.1.1",
    "cryptography ~= 50.0.2",
    "Pygments ~= 2.21.0",
    "prompt_toolkit ~= 3.0.53",
    "PyMySQL ~= 1.2.3",
    "sqlparse ~= 0.6.0",
    "sqlglot ~= 30.23.0",
    "sqlglotc ~= 30.23.0",
    "configobj ~= 5.0.9",
    "cli_helpers[styles] ~= 2.15.2",
    "wcwidth ~= 0.9.2",
    "pyperclip ~= 1.11.0",
    "pycryptodomex ~= 3.24.1",
    "rapidfuzz ~= 3.14.6",
    "keyring ~= 25.7.0",
    "jinja2 ~= 3.1.6",
    "markupsafe ~= 3.0.4",                  # removeme: transitive dependency forced for binary 3.15 wheel
    "yaspin ~= 3.5.1",
]

[project.urls]
Homepage = 'https://mycli.net'
Documentation = 'https://mycli.net/docs'
Source = 'https://github.com/dbcli/mycli'
Issues = 'https://github.com/dbcli/mycli/issues'
Changelog = 'https://github.com/dbcli/mycli/blob/main/changelog.md'

[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]


[project.optional-dependencies]
llm = [
    "llm ~= 0.36",
    "setuptools == 84.*",                   # Required by llm commands to install models
    "pip ~= 26.2.2",
]
dataframe = [
    "polars ~= 2.0.0",
    "altair ~= 6.3.0",
    "vl-convert-python ~= 1.9.0",
]
all = [
    "mycli[llm,dataframe]",
]
dev = [
    "behave ~= 1.3.3",
    "coverage ~= 7.16.2",
    "mypy ~= 2.4.0",
    "pexpect ~= 4.9.0",
    "pytest ~= 9.1.1",
    "pytest-cov ~= 7.1.0",
    "pytest-random-order ~= 1.2.0",
    "tox ~= 4.64.9",
    "pdbpp ~= 0.12.1",
    "ruff ~= 0.17.0",                       # keep in sync with the tool.tox.env.style stanza below
]

[project.scripts]
mycli = "mycli.main:main"

[tool.setuptools.package-data]
mycli = ["myclirc", "AUTHORS.txt", "SPONSORS.txt", "TIPS.txt"]

[tool.setuptools.packages.find]
include = ["mycli*"]

[tool.uv]
exclude-newer = '1 week'

[tool.uv.exclude-newer-package]
cli_helpers = false
pip = false                                 # removeme after 2026-10-27

[tool.ruff]
target-version = 'py311'
line-length = 140

[tool.ruff.lint]
select = ['A', 'B', 'I', 'E', 'W', 'F', 'C4', 'PIE', 'TID']
ignore = [
    'B005',   # Multi-character strip()
    'E401',   # Multiple imports on one line
    'E402',   # Module level import not at top of file
    'PIE808', # range() starting with 0
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    'E111', # indentation-with-invalid-multiple
    'E114', # indentation-with-invalid-multiple-comment
    'E117', # over-indented
    'W191', # tab-indentation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ['mycli', 'mycli_test', 'steps']

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.format]
preview = true
quote-style = 'preserve'
exclude = ['build', 'mycli_dev']

[tool.mypy]
pretty = true
strict_equality = true
ignore_missing_imports = true
warn_unreachable = true
warn_redundant_casts = true
warn_no_return = true
warn_unused_configs = true
show_column_numbers = true
exclude = ['^build/', '^dist/']

[tool.tox]
env_list = ['python']
requires = ['tox>=4.20']

[tool.tox.env_run_base]
skip_install = true
passenv = ['PYTEST_HOST',
           'PYTEST_USER',
           'PYTEST_PASSWORD',
           'PYTEST_PORT',
           'PYTEST_CHARSET',
           'GITHUB_ACTION']
commands = [['uv', 'pip', 'install', '-e', '.[dev,llm,dataframe]'],
            ['coverage', 'run', '-m', 'pytest', '-v', 'mycli_test'],
            ['coverage', 'report', '-m', '--sort=Miss'],
            ['behave', 'mycli_test/features']]
commands_post = [['rm', '-f', '--', './.myclirc']]
allowlist_externals = ['rm', 'uv']

[tool.tox.env.style]
skip_install = true
deps = ['ruff~=0.17.0']  # keep in sync with dev dependency group above
commands = [['ruff', 'check'],
            ['ruff', 'format', '--diff']]

[tool.tox.env.typecheck]
skip_install = true
commands = [['uv', 'run', '--no-sync', '--frozen', '--', 'python', '-m', 'ensurepip'],
            ['uv', 'run', '--no-sync', '--frozen', '--', 'python', '-m', 'mypy', '--no-pretty', '--install-types', '--non-interactive', '.']]

[tool.pytest]
addopts = ['--random-order']

[tool.coverage.run]
source = ['mycli']
