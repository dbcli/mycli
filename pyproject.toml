[project]
name = "mycli"
dynamic = ["version"]
description = "Rich terminal client for MySQL with autocompletion, syntax highlighting, and dataframes"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Mycli Core Team" }]
classifiers = [
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: SQL',
    'Topic :: Database',
    'Topic :: Database :: Front-Ends',
    'Topic :: Software Development',
]

dependencies = [
    # click 8.4.2 breaks the pager on Windows; check the next
    # version for https://github.com/pallets/click/pull/3739
    "click ~= 8.3.3",
    "clickdc ~= 0.1.1",
    "cryptography ~= 50.0.0",
    "Pygments ~= 2.20.0",
    "prompt_toolkit >= 3.0.41,<4.0.0",
    "PyMySQL ~= 1.1.2",
    "sqlparse >= 0.3.0,<0.6.0",
    "sqlglot ~= 30.12.0",
    "sqlglotc ~= 30.12.0",
    "configobj ~= 5.0.9",
    "cli_helpers[styles] ~= 2.15.1",
    "wcwidth ~= 0.8.2",
    "pyperclip ~= 1.11.0",
    "pycryptodomex ~= 3.23.0",
    "pyfzf ~= 0.3.1",
    "rapidfuzz ~= 3.14.3",
    "keyring ~= 25.7.0",
    "jinja2 ~= 3.1.6",
    "yaspin ~= 3.4.0",
]

[project.urls]
Homepage = 'https://mycli.net'
Documentation = 'https://mycli.net/docs'
Source = 'https://github.com/dbcli/mycli'
Issues = 'https://github.com/dbcli/mycli/issues'
Changelog = 'https://github.com/dbcli/mycli/blob/main/changelog.md'

[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]


[project.optional-dependencies]
llm = [
    "llm ~= 0.31.1",
    "setuptools == 83.*",                   # Required by llm commands to install models
    "pip ~= 26.1.2",
]
dataframe = [
    "polars ~= 1.42.1",
    "altair ~= 6.2.2",
    "vl-convert-python ~= 1.9.0",
]
all = [
    "mycli[llm,dataframe]",
]
dev = [
    "behave ~= 1.3.3",
    "coverage ~= 7.13.4",
    "mypy ~= 2.3.0",
    "pexpect ~= 4.9.0",
    "pytest ~= 9.1.1",
    "pytest-cov ~= 7.0.0",
    "pytest-random-order ~= 1.2.0",
    "tox ~= 4.35.0",
    "pdbpp ~= 0.11.7",
    "ruff ~= 0.15.0",
]

[project.scripts]
mycli = "mycli.main:main"

[tool.setuptools.package-data]
mycli = ["myclirc", "AUTHORS", "SPONSORS", "TIPS"]

[tool.setuptools.packages.find]
include = ["mycli*"]

[tool.uv]
exclude-newer = '1 week'
exclude-newer-package = { cli_helpers = false, openai = false, cryptography = false }

[tool.ruff]
target-version = 'py310'
line-length = 140

[tool.ruff.lint]
select = ['A', 'B', 'I', 'E', 'W', 'F', 'C4', 'PIE', 'TID']
ignore = [
    'B005',   # Multi-character strip()
    'E401',   # Multiple imports on one line
    'E402',   # Module level import not at top of file
    'PIE808', # range() starting with 0
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    'E111', # indentation-with-invalid-multiple
    'E114', # indentation-with-invalid-multiple-comment
    'E117', # over-indented
    'W191', # tab-indentation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ['mycli', 'test', 'steps']

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.format]
preview = true
quote-style = 'preserve'
exclude = ['build', 'mycli_dev']

[tool.mypy]
pretty = true
strict_equality = true
ignore_missing_imports = true
warn_unreachable = true
warn_redundant_casts = true
warn_no_return = true
warn_unused_configs = true
show_column_numbers = true
exclude = ['^build/', '^dist/']

[tool.tox]
env_list = ['python']
requires = ['tox>=4.20']

[tool.tox.env_run_base]
skip_install = true
deps = ['uv']
passenv = ['PYTEST_HOST',
           'PYTEST_USER',
           'PYTEST_PASSWORD',
           'PYTEST_PORT',
           'PYTEST_CHARSET',
           'GITHUB_ACTION']
commands = [['uv', 'pip', 'install', '-e', '.[dev,llm,dataframe]'],
            ['coverage', 'run', '-m', 'pytest', '-v', 'test'],
            ['coverage', 'report', '-m', '--sort=Miss'],
            ['behave', 'test/features']]
commands_post = [['rm', '-f', '--', './.myclirc']]
allowlist_externals = ['rm']

[tool.tox.env.style]
skip_install = true
deps = ['ruff']
commands = [['ruff', 'check'],
            ['ruff', 'format', '--diff']]

[tool.pytest]
addopts = ['--random-order']

[tool.coverage.run]
source = ['mycli']
