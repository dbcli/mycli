name: Lint
description: Run Lint Checks

runs:
  using: composite
  steps:
    - name: Run ruff check
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

    - name: Run ruff format
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        args: 'format --check'
