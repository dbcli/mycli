name: Lint

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'LICENSE.txt'
      - 'doc/**/*.txt'
      - '**/AUTHORS.txt'
      - '**/SPONSORS.txt'
      - '**/TIPS.txt'

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-26.04

    steps:
      - name: Check out Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Action
        uses: ./.github/actions/lint
