name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
      - 'LICENSE.txt'
      - 'doc/**/*.txt'
      - '**/AUTHORS.txt'
      - '**/SPONSORS.txt'
      - '**/TIPS.txt'

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start MySQL
        run: |
          sudo systemctl start mysql

      - name: Install dependencies
        run: uv sync --extra dev,llm,dataframe -p ${{ matrix.python-version }}

      - name: Wait for MySQL connection
        run: |
          while ! mysqladmin ping --host=localhost --port=3306 --user=root --password=root --silent; do
            sleep 5
          done

      - name: Pytest / behave
        env:
          PYTEST_PASSWORD: root
          PYTEST_HOST: 127.0.0.1
          TERM: xterm
        run: |
          ./.venv/bin/tox -e py${{ matrix.python-version }}

  tests-macos:
    name: Tests macOS
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MySQL
        run: |
          brew install mysql

      - name: Start MySQL
        run: |
          brew services start mysql

      - name: Install dependencies
        run: uv sync --extra dev,llm,dataframe -p ${{ matrix.python-version }}

      - name: Wait for MySQL connection
        run: |
          while ! mysqladmin ping --host=localhost --port=3306 --user=root --silent; do
            sleep 5
          done

      - name: Set MySQL test credentials
        run: |
          $(brew --prefix mysql)/bin/mysqladmin --host=localhost --port=3306 --user=root password root

      - name: Pytest / behave
        env:
          PYTEST_PASSWORD: root
          PYTEST_HOST: 127.0.0.1
          TERM: xterm
        run: |
          ./.venv/bin/tox -e py${{ matrix.python-version }}

  tests-windows:
    name: Tests Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.15']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: 'latest'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: cmd
        run: uv sync --extra dev,llm,dataframe -p ${{ matrix.python-version }}

      - name: Set up MySQL
        uses: shogo82148/actions-setup-mysql@64d04a653a0c02af310009d36ce74bec5f4dce4f # v1.55.0
        with:
          mysql-version: '9.7'
          root-password: root

      - name: Run pytest
        env:
          PYTEST_PASSWORD: root
          PYTEST_HOST: 127.0.0.1
        run: |
          uv run -- coverage run -m pytest
          uv run -- coverage report -m --sort=Miss --skip-covered --skip-empty

  tests-wsl:
    name: Tests WSL (3.15)
    runs-on: windows-latest

    steps:
      - uses: vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          use-cache: 'true'
          update: 'false'
          additional-packages: |
            curl
            git
            mysql-server
            pkg-config
            build-essential
            python3-pip

      - name: Create working directory
        shell: wsl-bash {0}
        run: |
          mkdir -p /root/mycli

      - uses: ubuntu/wsl/.github/actions/wsl-checkout@e7fb23c6481945b25b974b6cf7a5c7f4550b6cf8
        with:
          distro: Ubuntu-24.04
          working-dir: /root/mycli

      - name: Install uv
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          env PYTHONPATH=/usr/local/lib/python3.15/site-packages pip install --upgrade --break-system-packages --prefix=/usr uv

      - name: Install dependencies
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd /root/mycli
          uv sync --extra dev,llm,dataframe --python 3.15

      - name: Start MySQL in WSL
        shell: wsl-bash {0}
        run: |
          sudo service mysql start

      - name: Wait for MySQL connection
        shell: wsl-bash {0}
        run: |
          while ! mysqladmin ping --host=localhost --port=3306 --user=root --silent; do
            sleep 5
          done

      - name: Set up MySQL
        shell: wsl-bash {0}
        run: |
          mysqladmin -u root password root

      - name: Run pytest
        shell: wsl-bash {0}
        env:
          PYTEST_HOST: 127.0.0.1
          PYTEST_USER: root
          PYTEST_PASSWORD: root
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd /root/mycli
          uv run --python 3.15 -- coverage run -m pytest
          uv run --python 3.15 -- coverage report -m --sort=Miss --skip-covered --skip-empty

  test-no-extras:
    name: Tests Without Extras (3.15)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Start MySQL
        run: |
          sudo systemctl start mysql

      - name: Install dependencies
        run: uv sync --extra dev --python python3.15

      - name: Wait for MySQL connection
        run: |
          while ! mysqladmin ping --host=localhost --port=3306 --user=root --password=root --silent; do
            sleep 5
          done

      - name: Pytest / behave
        env:
          PYTEST_PASSWORD: root
          PYTEST_HOST: 127.0.0.1
          TERM: xterm
        run: |
          ./.venv/bin/tox -e py3.15

  docker-x86-build:
    name: Build x86 Docker Image
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    # simpler than the steps in publish.yml, because we don't do the slow buildx multiarch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false

  docker-arm-build:
    name: Build ARM Docker Image
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read

    # simpler than the steps in publish.yml, because we don't do the slow buildx multiarch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
